<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VA Jobs Map</title>
    <style>:root{--jobs-map-filterbar-color:#f0f0f0}html{scroll-snap-type:y proximity;scroll-behavior:smooth;height:100%}body{height:100%;margin:0;padding:0}section{scroll-snap-align:center;scroll-snap-stop:always;width:100%;height:100vh}jobs-map{scroll-snap-align:center;scroll-snap-stop:always}.map-site-nav{z-index:10000;background:#fffffff5;border-radius:999px;align-items:center;padding:4px;font:600 13px/1.2 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:flex;position:fixed;bottom:12px;right:12px;box-shadow:0 2px 14px #0000001f}.map-site-nav a{color:#374151;white-space:nowrap;border-radius:999px;padding:8px 14px;text-decoration:none}.map-site-nav a[aria-current=page]{color:#fff;background:#195eb6}.map-site-nav a:not([aria-current=page]):hover{background:#f3f4f6}.map-site-nav a:not([aria-current=page]):focus-visible{outline-offset:2px;outline:2px solid #195eb6}</style>
    <script type="module" crossorigin src="./assets/web-components.js"></script>
  </head>

  <body>
    <nav class="map-site-nav" aria-label="Choose map">
      <a href="./index.html" aria-current="page">Jobs map</a>
      <a href="./recruiters.html">Recruiter map</a>
    </nav>
    <section class="w-full h-screen overflow-hidden flex flex-col relative">
      <jobs-map
        initial-filters='{"whoCanApply": "public", "careerArea": "Nursing"}'
        mapbox-token="pk.eyJ1IjoiY2hyaXN0b3BoZXJjb3NuZXIiLCJhIjoiY21kZGFoaXdsMDJ1ajJubjMxdjRzZTBsMyJ9.d4fDFXYKjga4Hhc_60jaqw"
        mapbox-style="mapbox://styles/christophercosner/cmaznmgy800lu01rf1ql0bzmf"
        geojson-url="va-jobs.geojson"
      >
      </jobs-map>
    </section>
    <script>
      // Demo page only: link parameters set the map's filters, e.g. index.html?careerArea=Physicians&ruralOnly=1
      // Names are the initial-filters keys and values must match exactly. Any of them replaces the
      // defaults above; ?careerArea= (empty) shows all jobs. Runs before the module script defines <jobs-map>.
      (() => {
        const params = new URLSearchParams(location.search);
        const keys = ['careerArea', 'whoCanApply', 'workSchedule', 'ruralOnly', 'salaryMin', 'jobTitle', 'location'];
        if (!keys.some((key) => params.has(key))) return;
        const filters = {};
        for (const key of keys) {
          const value = (params.get(key) || '').trim();
          if (!value) continue;
          if (key === 'ruralOnly') filters.ruralOnly = value === '1' || value === 'true';
          else if (key === 'salaryMin') filters.salaryMin = Number(value) || undefined;
          else filters[key] = value;
        }
        document.querySelector('jobs-map').setAttribute('initial-filters', JSON.stringify(filters));
      })();
    </script>
  </body>
</html>
