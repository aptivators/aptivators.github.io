  <head>

    <title>Nurse recruiters</title>
    <style>html{scroll-behavior:smooth;height:100%}body{height:100%;margin:0;padding:0}section{width:100%;height:100vh}recruiters-map{width:100%;height:100%;display:block}.map-site-nav{z-index:10000;background:#fffffff5;border-radius:999px;align-items:center;padding:4px;font:600 13px/1.2 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:flex;position:fixed;bottom:12px;right:12px;box-shadow:0 2px 14px #0000001f}.map-site-nav a{color:#374151;white-space:nowrap;border-radius:999px;padding:8px 14px;text-decoration:none}.map-site-nav a[aria-current=page]{color:#fff;background:#195eb6}.map-site-nav a:not([aria-current=page]):hover{background:#f3f4f6}.map-site-nav a:not([aria-current=page]):focus-visible{outline-offset:2px;outline:2px solid #195eb6}</style>

    </nav>
    <section class="w-full h-screen overflow-hidden flex flex-col relative">
      <recruiters-map

        email-body-template-ppr="Hello {{displayName}}, I am interested in PPR opportunities at {{title}} ({{locationName}})."
